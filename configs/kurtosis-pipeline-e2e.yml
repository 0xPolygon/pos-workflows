# Pipeline-enabled kurtosis leg (POS-3697), consumed by bor's
# kurtosis-pipeline-e2e.yml workflow.
#
# Mirrors kurtosis-stateless-e2e.yml (participants 1-9
# keep the exact same indices — the stateless test suite
# hardcodes them) and adds a released-image baseline rpc node as participant
# 10. The bor workflow injects `[pipeline] enable-import-src = true` into the bor
# config template for every node; behavior then falls out per node role:
#
#   - full-sync bor:local nodes (1-3, 6, 7) import via the pipelined SRC
#   - stateless-sync nodes (4, 5, 8) self-gate the pipeline off
#   - the released-image stateless consumer (9) must replay witnesses served
#     by the pipelined bor:local producers
#   - the released-image baseline (10) ignores the unknown [pipeline] section
#     and independently validates every block the pipelined producers seal
#   - stateless validators (4, 5) syncing at head proves witnesses produced
#     by the pipelined SRC completion path replay correctly
polygon_pos_package:
  network_params:
    el_block_interval_seconds: 1

  participants:
    # 3 validators producing witnesses, full sync (pipelined via template).
    - kind: validator
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: false
      count: 3

    # 2 validators using stateless sync. Any of them having sync issue will
    # cause the test to fail.
    - kind: validator
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: true
      count: 2

    # 3 RPC nodes (same witness-flag matrix as the stateless leg).
    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: false
      el_bor_sync_with_witness: false
      count: 1

    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: false
      count: 1

    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: true
      count: 1

    # Mixed-version stateless consumer: a stateless rpc node on the bor
    # release currently running on mainnet. Every witness producer in this
    # devnet is bor:local, so this node can only sync if the release accepts
    # the witnesses the new build serves. Same index as in the stateless
    # config — the stateless suite addresses it as
    # RELEASED_STATELESS_RPC_INDEX. Don't add a released-image witness
    # producer: the node would then pull some witnesses from it and could
    # mask an incompatibility.
    #
    # CI swaps this image for the newest stable bor release (plain vX.Y.Z
    # tag with a GHCR image) through .github/actions/resolve-released-bor.
    # The pinned tag is the fallback for local runs and for workflows that
    # don't call the action; bump it now and then, in all three configs
    # (configs/kurtosis-stateless-e2e.yml,
    # .github/configs/kurtosis-stateless-e2e.yml,
    # configs/kurtosis-pipeline-e2e.yml). Use the GHCR image: Docker Hub
    # lags behind.
    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: ghcr.io/0xpolygon/bor:v2.10.3
      el_bor_produce_witness: false
      el_bor_sync_with_witness: true
      count: 1

    # Released-image baseline: a full-sync rpc node on the latest published
    # bor release. Its BurntSushi TOML parser ignores the injected [pipeline]
    # section, making it a genuine pipeline-off cross-check: it re-executes
    # and must accept every block the pipelined nodes produce. An rpc node
    # rather than a validator so it doesn't perturb the 5-validator producer
    # rotation the stateless suite's timing assertions are tuned for.
    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: 0xpolygon/bor:latest
      el_bor_produce_witness: false
      el_bor_sync_with_witness: false
      count: 1
