# Pipeline-enabled kurtosis leg (POS-3697), consumed by bor's
# kurtosis-pipeline-e2e.yml workflow.
#
# Mirrors kurtosis-stateless-e2e.yml (participants 1-8
# keep the exact same indices — the stateless test suite
# hardcodes them) and adds a released-image baseline rpc node as participant
# 9. The bor workflow injects `[pipeline] enable-import-src = true` into the bor
# config template for every node; behavior then falls out per node role:
#
#   - full-sync bor:local nodes (1-3, 6, 7) import via the pipelined SRC
#   - stateless-sync nodes (4, 5, 8) self-gate the pipeline off
#   - the released-image baseline (9) ignores the unknown [pipeline] section
#     and independently validates every block the pipelined producers seal
#   - stateless validators (4, 5) syncing at head proves witnesses produced
#     by the pipelined SRC completion path replay correctly
polygon_pos_package:
  network_params:
    el_block_interval_seconds: 1

  participants:
    # 3 validators producing witnesses, full sync (pipelined via template).
    - kind: validator
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: false
      count: 3

    # 2 validators using stateless sync. Any of them having sync issue will
    # cause the test to fail.
    - kind: validator
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: true
      count: 2

    # 3 RPC nodes (same witness-flag matrix as the stateless leg).
    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: false
      el_bor_sync_with_witness: false
      count: 1

    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: false
      count: 1

    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: bor:local
      el_bor_produce_witness: true
      el_bor_sync_with_witness: true
      count: 1

    # Released-image baseline: a full-sync rpc node on the latest published
    # bor release. Its BurntSushi TOML parser ignores the injected [pipeline]
    # section, making it a genuine pipeline-off cross-check: it re-executes
    # and must accept every block the pipelined nodes produce. An rpc node
    # rather than a validator so it doesn't perturb the 5-validator producer
    # rotation the stateless suite's timing assertions are tuned for.
    - kind: rpc
      cl_type: heimdall-v2
      cl_image: heimdall-v2:local
      el_type: bor
      el_image: 0xpolygon/bor:latest
      el_bor_produce_witness: false
      el_bor_sync_with_witness: false
      count: 1
